<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d2149">
  <title>Bus Atlas — Operadoras globais</title>
  <style>
    :root { --ink:#102348; --muted:#63728a; --line:#dce4ef; --sky:#edf5ff; --accent:#ef672f; --card:#fff; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color:var(--ink); background:#f5f8fc; }
    .hero { color:#fff; background:radial-gradient(circle at 86% 10%, #2867b5 0, transparent 29%), linear-gradient(120deg,#07162f,#123a75); padding:44px max(24px, calc((100vw - 1240px)/2)); }
    .eyebrow { margin:0 0 10px; color:#96c9ff; letter-spacing:.12em; font-size:.74rem; font-weight:800; text-transform:uppercase; }
    h1 { margin:0; letter-spacing:-.035em; font-size:clamp(2rem,4vw,3.6rem); line-height:1; }
    .hero p { max-width:620px; margin:16px 0 0; color:#d4e2f7; font-size:1.05rem; line-height:1.55; }
    main { width:min(1240px, calc(100% - 40px)); margin: -22px auto 48px; }
    .controls { display:grid; grid-template-columns:2fr 1fr 1fr auto; gap:12px; padding:16px; background:#fff; border:1px solid #e6edf6; border-radius:15px; box-shadow:0 12px 34px #1a325014; }
    input, select { appearance:none; width:100%; min-height:47px; padding:0 13px; border:1px solid #cbd7e6; border-radius:9px; font:inherit; color:var(--ink); background:#fff; outline:none; }
    input:focus, select:focus { border-color:#2876c9; box-shadow:0 0 0 3px #b9dcff88; }
    .local-only { display:flex; align-items:center; gap:8px; min-height:47px; padding:0 11px; border:1px solid #cbd7e6; border-radius:9px; color:#38516e; white-space:nowrap; font-size:.87rem; font-weight:700; cursor:pointer; }
    .local-only input { width:17px; min-height:0; height:17px; margin:0; accent-color:#1769b0; cursor:pointer; }
    .summary { display:flex; justify-content:space-between; align-items:center; margin:29px 2px 16px; color:var(--muted); font-size:.93rem; }
    .summary strong { color:var(--ink); font-size:1.05rem; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); gap:16px; }
    .company { position:relative; min-height:224px; display:flex; flex-direction:column; padding:21px; border:1px solid var(--line); border-radius:14px; background:var(--card); box-shadow:0 2px 4px #12345608; transition:transform .18s, box-shadow .18s; }
    .company:hover { transform:translateY(-3px); box-shadow:0 13px 25px #12345616; }
    .top { display:flex; gap:14px; align-items:center; }
    .logo { flex:0 0 58px; height:58px; display:grid; place-items:center; overflow:hidden; border:1px solid #e5eaf1; border-radius:12px; background:#f7f9fc; color:#4d6383; font-size:1.35rem; font-weight:800; }
    .logo img { width:100%; height:100%; object-fit:contain; padding:4px; }
    h2 { margin:0; font-size:1.06rem; line-height:1.25; letter-spacing:-.015em; }
    .country { margin:5px 0 0; color:var(--muted); font-size:.84rem; }
    .tag { display:inline-flex; align-items:center; width:max-content; margin:19px 0 14px; padding:5px 8px; border-radius:99px; color:#24537a; background:#e9f5ff; font-size:.71rem; font-weight:800; letter-spacing:.06em; }
    .stats { display:grid; grid-template-columns:1fr 1fr; margin-top:auto; padding-top:13px; border-top:1px solid #edf0f4; }
    .stats span { display:block; color:var(--muted); font-size:.72rem; }
    .stats strong { display:block; margin-top:3px; font-size:.96rem; }
    .profile { position:absolute; inset:0; border-radius:14px; }
    .profile:focus { outline:3px solid #86bbef; outline-offset:2px; }
    .empty { grid-column:1/-1; padding:50px 20px; border:1px dashed #b8c7d8; border-radius:14px; text-align:center; color:var(--muted); background:#fff; }
    .pager { display:flex; justify-content:center; align-items:center; gap:12px; margin:28px 0; }
    button { min-height:39px; border:1px solid #b9cae0; border-radius:8px; padding:0 15px; color:var(--ink); background:#fff; font:inherit; font-weight:700; cursor:pointer; }
    button:hover:not(:disabled) { background:#eef6ff; } button:disabled { opacity:.42; cursor:not-allowed; }
    #pageInfo { min-width:110px; text-align:center; color:var(--muted); font-size:.86rem; }
    .error { margin-top:24px; padding:18px; border-left:4px solid #d84e3d; background:#fff1ef; color:#803129; border-radius:7px; }
    @media (max-width:780px) { .controls { grid-template-columns:1fr 1fr; } }
    @media (max-width:680px) { .hero { padding-top:32px; } main { width:min(100% - 28px, 1240px); } .controls { grid-template-columns:1fr; } .summary { align-items:flex-start; flex-direction:column; gap:5px; } }
  </style>
</head>
<body>
  <header class="hero">
    <p class="eyebrow">Base consolidada</p>
    <h1>Bus Atlas</h1>
    <p>Explore operadoras de ônibus e ferry do mundo inteiro a partir da base de dados final.</p>
  </header>
  <main>
    <section class="controls" aria-label="Filtros do catálogo">
      <input id="query" type="search" placeholder="Buscar por empresa ou país" autocomplete="off">
      <select id="country"><option value="">Todos os países</option></select>
      <select id="transport"><option value="">Ônibus e ferry</option><option value="BUS">Ônibus</option><option value="FERRY">Ferry</option></select>
      <label class="local-only" title="Exibe somente empresas cuja logo foi baixada para este computador"><input id="localOnly" type="checkbox"> Logo local</label>
    </section>
    <div class="summary"><strong id="count">Carregando catálogo…</strong><span id="catalogueInfo"></span></div>
    <section class="grid" id="grid" aria-live="polite"></section>
    <nav class="pager" aria-label="Paginação"><button id="previous">← Anterior</button><span id="pageInfo"></span><button id="next">Próxima →</button></nav>
    <div class="error" id="error" hidden></div>
  </main>
  <script>
    const state = { companies: [], filtered: [], page: 1, perPage: 24 };
    const el = (id) => document.getElementById(id);
    const escapeHtml = (value) => String(value ?? '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    const initials = (name) => (name || '?').split(/\s+/).slice(0, 2).map(word => word[0]).join('').toUpperCase();
    const formatNumber = (value) => value === '' || value === null || value === undefined ? '—' : new Intl.NumberFormat('pt-BR').format(Number(value));

    function filter() {
      const text = el('query').value.trim().toLocaleLowerCase();
      const country = el('country').value;
      const transport = el('transport').value;
      const localOnly = el('localOnly').checked;
      state.filtered = state.companies.filter(c => (!text || `${c.operator} ${c.country}`.toLocaleLowerCase().includes(text)) && (!country || c.country === country) && (!transport || c.transport_type === transport) && (!localOnly || c.logo_file));
      state.page = 1;
      render();
    }

    function render() {
      const total = state.filtered.length, pages = Math.max(1, Math.ceil(total / state.perPage));
      state.page = Math.min(state.page, pages);
      const first = (state.page - 1) * state.perPage;
      const cards = state.filtered.slice(first, first + state.perPage);
      el('count').textContent = `${new Intl.NumberFormat('pt-BR').format(total)} empresa${total === 1 ? '' : 's'} encontrada${total === 1 ? '' : 's'}`;
      el('pageInfo').textContent = total ? `Página ${state.page} de ${pages}` : '';
      el('previous').disabled = state.page === 1 || !total;
      el('next').disabled = state.page === pages || !total;
      el('grid').innerHTML = cards.length ? cards.map(c => {
        const image = c.logo_file ? `<img src="logos_global/${encodeURIComponent(c.logo_file)}" alt="Logo da ${escapeHtml(c.operator)}" onerror="this.remove()">` : initials(c.operator);
        const link = c.profile_url ? `<a class="profile" href="${escapeHtml(c.profile_url)}" target="_blank" rel="noopener" aria-label="Abrir perfil de ${escapeHtml(c.operator)}"></a>` : '';
        return `<article class="company">${link}<div class="top"><div class="logo">${image}</div><div><h2>${escapeHtml(c.operator)}</h2><p class="country">${escapeHtml(c.country || 'País não informado')}</p></div></div><span class="tag">${c.transport_type === 'FERRY' ? 'FERRY' : 'ÔNIBUS'}</span><div class="stats"><div><span>Avaliação</span><strong>${c.rating || '—'} / 10</strong></div><div><span>Rotas</span><strong>${formatNumber(c.number_of_routes)}</strong></div></div></article>`;
      }).join('') : '<div class="empty">Nenhuma empresa corresponde aos filtros selecionados.</div>';
    }

    async function load() {
      try {
        const response = await fetch('global_companies.json');
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        state.companies = await response.json();
        const countries = [...new Set(state.companies.map(c => c.country).filter(Boolean))].sort((a,b) => a.localeCompare(b));
        el('country').insertAdjacentHTML('beforeend', countries.map(country => `<option value="${escapeHtml(country)}">${escapeHtml(country)}</option>`).join(''));
        el('catalogueInfo').textContent = `Catálogo com ${new Intl.NumberFormat('pt-BR').format(state.companies.length)} registros`;
        state.filtered = state.companies;
        render();
      } catch (err) {
        el('count').textContent = 'Não foi possível carregar o catálogo';
        el('error').hidden = false;
        el('error').textContent = `Verifique se o servidor foi iniciado na pasta do projeto. Detalhe: ${err.message}`;
      }
    }
    ['query', 'country', 'transport', 'localOnly'].forEach(id => el(id).addEventListener(id === 'query' ? 'input' : 'change', filter));
    el('previous').addEventListener('click', () => { state.page--; render(); window.scrollTo({top: 0, behavior: 'smooth'}); });
    el('next').addEventListener('click', () => { state.page++; render(); window.scrollTo({top: 0, behavior: 'smooth'}); });
    load();
  </script>
</body>
</html>
